<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#004191">
<title>주간업무보고</title>
<style>
  /* 핸드폰에서 읽기 위한 페이지다. 사내 서버(10.10.10.88)는 회사 밖에서
     열리지 않으니, 내용을 data.js 에 담아 깃허브에 올려두고 여기서 그린다.

     이 주소는 공개다 — 주소를 아는 사람은 볼 수 있다.

     핸드폰이 기준이다. 가로 스크롤은 어디에도 만들지 않는다 —
     긴 줄은 pre-wrap + break-word 로 접고, 표는 쓰지 않는다. */

  :root {
    --blue: #004191;
    --blue-700: #003879;
    --sky: #EEF4FC;
    --ink: #0E1A2C;
    --ink-3: #7A8497;
    --line: #E3E7EE;
    --bg: #F6F8FB;
    --amber-50: #FDF3DC;
    --amber-ink: #8A6400;
    --ok: #14724A;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    font-size: 15px;
    line-height: 1.5;
    word-break: keep-all;
    -webkit-text-size-adjust: 100%;
  }

  .top {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    padding-top: max(12px, env(safe-area-inset-top));
    background: var(--blue);
    color: #fff;
  }
  .top h1 { flex: 1; font-size: 16px; margin: 0; font-weight: 600; letter-spacing: -.2px; }
  .top button {
    font: inherit;
    font-size: 13px;
    padding: 5px 11px;
    border: 1px solid rgba(255, 255, 255, .45);
    border-radius: 8px;
    background: transparent;
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
  }
  .top button:active { background: rgba(255, 255, 255, .18); }

  main { padding: 14px 14px 44px; max-width: 720px; margin: 0 auto; }

  .stamp { font-size: 12.5px; color: var(--ink-3); margin: 0 0 12px; text-align: center; }

  /* 주차 목록 */
  .weeks { display: grid; gap: 8px; }
  .week {
    display: block;
    width: 100%;
    text-align: left;
    font: inherit;
    color: inherit;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
  }
  .week:active { background: var(--sky); }
  .week-title { font-weight: 700; font-size: 15.5px; }
  .week-sub { font-size: 12.5px; color: var(--ink-3); margin-top: 3px; }

  /* 보고서 */
  .person {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .person > h2 {
    font-size: 16px;
    margin: 0 0 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .badge {
    font-size: 11.5px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--sky);
    color: var(--blue);
  }
  .badge.draft { background: var(--amber-50); color: var(--amber-ink); }

  .marks {
    font-size: 12.5px;
    background: var(--amber-50);
    color: var(--amber-ink);
    border-radius: 8px;
    padding: 6px 10px;
    margin-bottom: 12px;
  }

  .counts { background: var(--sky); border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; }
  .counts-total { font-weight: 700; color: var(--blue-700); }
  .counts-kinds { font-size: 13px; margin-top: 3px; }
  .counts-days { font-size: 12.5px; color: var(--ink-3); margin-top: 3px; }

  .sec { margin-top: 16px; }
  .sec > h3 {
    font-size: 13px;
    margin: 0 0 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
    color: var(--blue-700);
  }
  .sec > h3 em { font-style: normal; font-weight: 400; color: var(--ink-3); }

  .items { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .items > li { display: grid; gap: 5px; }

  .it-head { display: flex; gap: 7px; align-items: baseline; }
  .it-no { font-size: 12px; color: var(--ink-3); flex: none; font-variant-numeric: tabular-nums; }
  /* 원문 줄바꿈을 그대로 살리면서 긴 줄은 접는다 */
  .it-title { font-weight: 600; white-space: pre-wrap; overflow-wrap: break-word; min-width: 0; }
  .tag {
    flex: none;
    font-size: 11px;
    font-weight: 600;
    padding: 1px 7px;
    border-radius: 999px;
    background: #E7F3EC;
    color: var(--ok);
    white-space: nowrap;
  }
  .tag.pct { background: var(--amber-50); color: var(--amber-ink); }

  .it-detail {
    white-space: pre-wrap;
    overflow-wrap: break-word;
    font-size: 13.5px;
    color: #33405A;
    background: var(--bg);
    border-left: 2px solid var(--line);
    border-radius: 0 8px 8px 0;
    padding: 8px 10px;
    margin: 0;
  }
  .it-meta { font-size: 12px; color: var(--ink-3); overflow-wrap: break-word; }

  .empty { text-align: center; color: var(--ink-3); padding: 40px 0; font-size: 13.5px; }
</style>
</head>
<body>

<div class="top">
  <button id="back" type="button" hidden>← 목록</button>
  <h1 id="title">주간업무보고</h1>
</div>
<main id="body"></main>

<script src="data.js"></script>
<script>
(() => {
  'use strict';

  const titleEl = document.getElementById('title');
  const bodyEl = document.getElementById('body');
  const backBtn = document.getElementById('back');
  const data = window.WR;

  function showWeeks() {
    backBtn.hidden = true;
    titleEl.textContent = '주간업무보고';
    bodyEl.innerHTML = '';

    const stamp = document.createElement('p');
    stamp.className = 'stamp';
    stamp.textContent = '갱신 ' + data.stamp;
    bodyEl.append(stamp);

    if (!data.weeks.length) {
      const none = document.createElement('div');
      none.className = 'empty';
      none.textContent = '올라온 보고서가 없습니다.';
      bodyEl.append(none);
      return;
    }

    const list = document.createElement('div');
    list.className = 'weeks';
    data.weeks.forEach((w, i) => {
      const btn = document.createElement('button');
      btn.className = 'week';
      btn.type = 'button';

      const t = document.createElement('div');
      t.className = 'week-title';
      t.textContent = w.title;

      const s = document.createElement('div');
      s.className = 'week-sub';
      s.textContent = w.span + ' · ' + w.names;

      btn.append(t, s);
      btn.addEventListener('click', () => showWeek(i));
      list.append(btn);
    });
    bodyEl.append(list);
  }

  function showWeek(i) {
    const w = data.weeks[i];
    backBtn.hidden = false;
    titleEl.textContent = w.title;
    // 만들 때 이미 escape 한 내용이다 (tools/phone-export.ps1 의 Get-Esc)
    bodyEl.innerHTML = w.html;
    window.scrollTo(0, 0);
  }

  backBtn.addEventListener('click', showWeeks);

  if (!data) {
    bodyEl.innerHTML = '<div class="empty">내용 파일(data.js)을 불러오지 못했습니다.</div>';
  } else {
    showWeeks();
  }
})();
</script>
</body>
</html>
