<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1460">
<meta name="robots" content="noindex, nofollow">
<title>주간업무보고</title>
<link rel="stylesheet" href="assets/design-system/colors_and_type.css?v=20260904143923">
<link rel="stylesheet" href="assets/app.css?v=20260904143923">
<link rel="stylesheet" href="phone-readonly.css">
<script src="phone-config.js"></script>
<script src="phone-readonly.js"></script>
</head>
<!-- 업무 용어·룰 코드가 많아 브라우저 맞춤법 검사가 온통 빨간 밑줄을 긋는다.
     spellcheck 는 자식 요소로 물려받으므로 여기서 한 번만 끄면 된다. -->
<body spellcheck="false">

<header class="topbar" id="topbar">
  <button class="brand-home" id="btn-logo" type="button" title="홈으로">
    <img class="brand-logo" src="assets/logo-medigent.png" alt="Medigent" width="377" height="143">
  </button>
  <div class="brand-div"></div>
  <h1>주간업무보고</h1>
  <div class="grow"></div>
  <nav class="navlinks" id="navlinks">
    <button class="linkbtn" data-view="home">홈</button>
    <button class="linkbtn" data-view="write">작성</button>
    <button class="linkbtn" data-view="archive">기록 조회</button>
    <button class="linkbtn" data-view="stats">통계</button>
    <button class="linkbtn" data-view="settings">설정</button>
  </nav>
  <button class="whoami" id="whoami" title="사용자 변경"><span id="whoami-name"></span></button>
  <div class="saved" id="saved"><span class="saved-dot"></span><span id="saved-text">변경사항 없음</span></div>
  <button class="btn" id="btn-draft">임시저장</button>
  <button class="btn-primary" id="btn-submit">제출</button>
</header>

<div class="viewbar" id="viewbar">
  <span class="eyebrow">VIEW</span>
  <select id="sel-week" class="field field-week"></select>
  <input id="sel-date" class="field field-date" type="date"
         title="날짜를 고르면 그 주의 보고서로 이동합니다">
  <button class="btn btn-icon" id="btn-prev-week" type="button" title="이전 주">◀</button>
  <button class="btn btn-icon" id="btn-next-week" type="button" title="다음 주 (미리 작성)">▶</button>
  <select id="sel-author" class="field field-author"></select>
  <span class="chip" id="chip-status"><span class="chip-dot"></span><span id="chip-text">작성 중</span></span>
  <div class="grow"></div>
  <span class="range" id="week-range"></span>
  <button class="btn" id="btn-thisweek">이번 주</button>
</div>

<main id="view"></main>

<div class="toast-wrap" id="toasts"></div>

<script type="module" src="assets/js/main.js?v=20260904143923"></script>

<!-- file:// 로 직접 열면 ES 모듈이 CORS에 막혀 앱이 뜨지 않는다.
     그냥 빈 화면이 되지 않도록, 안 떴을 때 이유를 알려준다. -->
<script>
setTimeout(function () {
  var view = document.getElementById('view');
  if (!view || view.children.length) return;   // 정상적으로 떴으면 아무것도 안 한다
  var isFile = location.protocol === 'file:';
  view.innerHTML =
    '<div class="panel" style="max-width:640px;margin:40px auto">' +
      '<h2>화면을 불러오지 못했습니다</h2>' +
      (isFile
        ? '<p class="hint">파일을 더블클릭해서 열면 브라우저 보안정책 때문에 동작하지 않습니다. ' +
          '주소창이 <code>file://</code> 로 시작하고 있습니다.</p>' +
          '<div class="callout">' +
            '<strong>이렇게 여세요</strong>' +
            '<ul>' +
              '<li>같은 폴더의 <code>주간업무보고 열기.bat</code> 을 더블클릭하세요. ' +
                '서버가 뜨고 브라우저가 자동으로 열립니다.</li>' +
              '<li>이미 서버가 떠 있다면 <code>http://localhost:8787</code> 로 접속하세요.</li>' +
              '<li>부서 깃에 배포된 주소가 있으면 그 주소로 바로 열면 됩니다.</li>' +
            '</ul>' +
          '</div>'
        : '<p class="hint">스크립트를 불러오지 못했습니다. 새로고침해도 같으면 ' +
          '브라우저 개발자도구(F12) 콘솔의 오류 내용을 알려주세요.</p>') +
    '</div>';
}, 1200);
</script>
</body>
</html>
